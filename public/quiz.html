<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="chơi ăn gian là tui biết đó nha🙂">
    <meta name="theme-color" content="#12103d">
    <title>Trắc nghiệm Triết học Mác - Lênin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="quiz.css">
</head>


<body>
    <div class="main">
        <header class="header">
            <div class="grid grid__row header-layout">
                <p class="header-info" id="player-info" hidden>
                    👤 bạn: <span id="display-name" class="highlight-text"></span>
                </p>
                <p class="header-score" id="score-board" hidden>
                    Điểm: <span id="score" class="highlight-text">0</span>
                </p>
            </div>
        </header>

        <main class="container grid">
            <!-- 1. Màn hình bắt đầu -->
            <section id="start-screen" class="screen" aria-labelledby="start-title">
                <h1 id="start-title" class="title">Mini game zui zẻ</h1>
                <p id="start-info" class="muted"></p>
                <div class="input-group">
                    <label for="player-name" class="visually-hidden">Tên của bạn</label>
                    <input type="text" id="player-name" maxlength="30" autocomplete="nickname"
                        placeholder="Nhập tên của bạn để bắt đầu...">
                    <p id="name-error" class="error" role="alert" hidden></p>
                </div>
                <button type="button" id="btn-start" class="btn">Bắt đầu</button>
            </section>

            <!-- 2. Màn hình câu hỏi -->
            <section id="quiz-screen" class="screen" aria-labelledby="question-text" hidden>
                <div class="quiz-top">
                    <p class="question-counter">Câu <span id="current-number">1</span>/<span
                            id="total-questions">1</span></p>
                    <p class="timer" id="timer">⏳ <span id="time-left">15</span>s<span class="visually-hidden"> còn
                            lại</span></p>
                </div>
                <div class="progress" id="progress" role="progressbar" aria-label="Tiến độ bài thi" aria-valuemin="0"
                    aria-valuemax="1" aria-valuenow="0">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="question-box">
                    <h2 id="question-text">Đang tải câu hỏi...</h2>
                </div>
                <div class="answers-grid" role="group" aria-label="Các đáp án">
                    <button type="button" class="btn answer-btn" data-index="0"></button>
                    <button type="button" class="btn answer-btn" data-index="1"></button>
                    <button type="button" class="btn answer-btn" data-index="2"></button>
                    <button type="button" class="btn answer-btn" data-index="3"></button>
                </div>
                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            </section>

            <!-- 3. Màn hình kết quả -->
            <section id="result-screen" class="screen" aria-labelledby="result-title" hidden>
                <h2 id="result-title" class="title">Hoàn thành bài thi!</h2>
                <p>Chúc mừng <span id="final-name" class="highlight-text"></span> đã hoàn thành bài trắc nghiệm.</p>
                <p class="final-score-text">Tổng điểm: <span id="final-score">0</span></p>
                <dl class="stats">
                    <div>
                        <dt>Đúng</dt>
                        <dd id="stat-correct">0</dd>
                    </div>
                    <div>
                        <dt>Sai</dt>
                        <dd id="stat-wrong">0</dd>
                    </div>
                    <div>
                        <dt>Hết giờ</dt>
                        <dd id="stat-timeout">0</dd>
                    </div>
                    <div>
                        <dt>Tỉ lệ đúng</dt>
                        <dd id="stat-accuracy">0%</dd>
                    </div>
                </dl>
                <p id="rank-text" class="rank-text"></p>
                <p id="save-note" class="muted" role="status"></p>
                <h3 class="board-title">Bảng xếp hạng</h3>
                <ol id="leaderboard" class="leaderboard" aria-label="Bảng xếp hạng"></ol>

            </section>
        </main>

        <footer class="footer">
            <p>Nhóm 5</p>
        </footer>
    </div>
    <script src="quiz.js"></script>
</body>

</html>
